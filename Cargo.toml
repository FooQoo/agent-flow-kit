[workspace]
members = ["crates/core", "crates/mcp"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
