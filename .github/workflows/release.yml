name: Release AFK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify plugin sync and release tag version
        run: |
          scripts/sync-plugins.sh --check
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${cargo_version}" ]; then
            printf 'Tag %s does not match Cargo.toml version v%s\n' "${GITHUB_REF_NAME}" "${cargo_version}" >&2
            exit 1
          fi

  build:
    needs: verify
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, binary: afk-linux-x64, built: target/release/afk}
          - {runner: ubuntu-22.04-arm, binary: afk-linux-arm64, built: target/release/afk}
          - {runner: macos-15, binary: afk-macos-arm64, built: target/release/afk}
          - {runner: macos-15-intel, binary: afk-macos-x64, built: target/release/afk}
          - {runner: windows-2022, binary: afk-windows-x64.exe, built: target/release/afk.exe}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      - run: cargo +1.96.0 fmt --all --check
      - run: cargo +1.96.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.96.0 test --locked --workspace
      - run: cargo +1.96.0 build --locked --release
      - name: Run integration tests
        env:
          BUILT: ${{ matrix.built }}
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            PY=python
          else
            PY=python3
          fi
          "$PY" tests/integration/stdio_workflow.py "$BUILT"
          if [ "${RUNNER_OS}" != "Windows" ]; then
            "$PY" tests/integration/run_bootstrap.py plugins/codex/run "$BUILT"
            "$PY" tests/integration/run_bootstrap.py plugins/claude-code/run "$BUILT"
          fi
      - name: Stage binary and inspect dependencies
        env:
          BINARY: ${{ matrix.binary }}
          BUILT: ${{ matrix.built }}
        run: |
          mkdir -p staged
          install -m 755 "$BUILT" "staged/$BINARY"
          wc -c "staged/$BINARY"
          if [ "${RUNNER_OS}" = "macOS" ]; then
            otool -L "staged/$BINARY"
          elif [ "${RUNNER_OS}" = "Linux" ]; then
            ldd "staged/$BINARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: staged/${{ matrix.binary }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: afk-*
          merge-multiple: true
      - name: Assemble and smoke-test release archives
        run: |
          lipo -create binaries/afk-macos-arm64 binaries/afk-macos-x64 -output binaries/afk-macos
          lipo -verify_arch arm64 x86_64 binaries/afk-macos
          codesign --sign - --force binaries/afk-macos
          scripts/package.sh binaries packages all
          python3 tests/integration/stdio_workflow.py packages/codex/plugins/agent-flow-kit/run
          mkdir -p dist
          for client in claude-code codex; do
            tar -C packages -czf "dist/afk-$client.tar.gz" "$client"
          done
          for binary in afk-macos afk-linux-x64 afk-linux-arm64 afk-windows-x64.exe; do
            chmod +x "binaries/$binary"
            archive="${binary%.exe}.tar.gz"
            tar -C binaries -czf "dist/$archive" "$binary"
          done
          (cd dist && shasum -a 256 ./*.tar.gz > SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            tag="v${cargo_version}"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes
          fi
